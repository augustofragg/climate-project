<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima</title>
  </head>
  <body>
    <div id="app">
      <header class="search">
        <form id="search-form" class="search__form" role="search">
          <label for="search-input" class="visually-hidden">Cidade</label>
          <input
            id="search-input"
            class="search__input"
            type="search"
            name="city"
            placeholder="Digite o nome da cidade"
            autocomplete="off"
          />
          <button id="search-button" class="search__button" type="submit">Buscar</button>
        </form>
      </header>

      <main id="weather-card" class="card" data-state="empty" aria-live="polite">
        <div id="empty-state" class="state state--empty">
          <p class="state__message">Pesquise uma cidade para ver o clima</p>
        </div>

        <div id="loading-state" class="state state--loading" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p class="state__message">Carregando…</p>
        </div>

        <aside id="sidebar" class="sidebar">
          <p id="temperature" class="sidebar__temperature"></p>
          <p id="location" class="sidebar__location"></p>
          <p id="current-date" class="sidebar__date"></p>
          <p class="sidebar__period">
            <img id="day-period-icon" class="sidebar__period-icon" alt="" width="24" height="24" />
            <span id="day-period"></span>
          </p>
          <p id="condition" class="sidebar__condition"></p>
        </aside>

        <section id="details" class="details" aria-label="Detalhes do clima">
          <dl class="details__grid">
            <div class="details__item">
              <dt class="details__label">Umidade</dt>
              <dd id="humidity" class="details__value"></dd>
            </div>
            <div class="details__item">
              <dt class="details__label">Sensação térmica</dt>
              <dd id="apparent-temperature" class="details__value"></dd>
            </div>
            <div class="details__item">
              <dt class="details__label">Precipitação</dt>
              <dd id="precipitation" class="details__value"></dd>
            </div>
            <div class="details__item">
              <dt class="details__label">Vento</dt>
              <dd id="wind" class="details__value"></dd>
            </div>
          </dl>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
